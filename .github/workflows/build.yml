name: Build & sign extension

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    # Single owner for release creation: concurrent "gh release create"
    # calls race and end up with duplicate draft releases.
    prepare-release:
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Idempotent: falls back to view when the release already
              # exists (e.g. re-pushed tag after a failed attempt).
              run: |
                  gh release create "${{ github.ref_name }}" --draft \
                      --generate-notes -R "$GITHUB_REPOSITORY" \
                      || gh release view "${{ github.ref_name }}" -R "$GITHUB_REPOSITORY"

    build-extension:
        needs: prepare-release
        if: ${{ !failure() && !cancelled() }}
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.x

            - run: npm ci

            # AMO refuses to sign the same version twice, so a mismatched tag
            # must be rejected before signing consumes the version.
            - name: Verify tag matches manifest version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  VERSION=$(node -p "require('./manifest.json').version")
                  if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
                    echo "::error::Tag $GITHUB_REF_NAME does not match extension version v$VERSION"
                    exit 1
                  fi

            - name: Sign extension (AMO)
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
                  WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
              run: |
                  if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
                    echo "::error::Set the AMO_API_KEY / AMO_API_SECRET repository secrets (create a key at https://addons.mozilla.org/developers/addon/api/key/)"
                    exit 1
                  fi
                  npm run sign

            # Signing consumes the AMO version, so it only runs for tag
            # pushes (manual dispatch never signs).
            - uses: actions/upload-artifact@v7
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  name: voice-edge-auth-sync-signed
                  path: dist/signed/*.xpi

            - name: Publish signed xpi to release
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  # AMO names signed files after the add-on's internal ID;
                  # publish under the project name instead.
                  VERSION=$(node -p "require('./manifest.json').version")
                  RELEASE_XPI="voice-edge-auth-sync-${VERSION}.xpi"
                  cp dist/signed/*.xpi "$RELEASE_XPI"

                  gh release upload "$RELEASE_TAG" "$RELEASE_XPI" \
                      --clobber -R "$GITHUB_REPOSITORY"

    publish:
        needs: [build-extension]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            # Assets are uploaded to a draft while the build runs; publish
            # it once everything has succeeded.
            - env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "${{ github.ref_name }}" --draft=false -R "$GITHUB_REPOSITORY"
